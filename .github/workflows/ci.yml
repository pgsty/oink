name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: Browser runtime tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # The theme ships its browser runtimes as plain assets, so these run
      # without an install step. They are the only automated coverage of the
      # shell, palette, search, and action-registry behavior in this repository.
      - name: Run browser runtime tests
        run: node --test 'tests/js/**/*.test.js'

  publication:
    name: Book publication
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Install pinned publication tools
        shell: bash
        run: |
          pandoc_archive="$RUNNER_TEMP/pandoc-3.10-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$pandoc_archive" \
            https://github.com/jgm/pandoc/releases/download/3.10/pandoc-3.10-linux-amd64.tar.gz
          echo "e0f8af62d0f267d22baa5bcefe6d5dda3a097ccc60de794b759fe03159923244  $pandoc_archive" \
            | sha256sum --check
          tar --extract --gzip --file "$pandoc_archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pandoc-3.10/bin" >> "$GITHUB_PATH"

          epubcheck_archive="$RUNNER_TEMP/epubcheck-5.3.0.zip"
          curl --fail --location --silent --show-error \
            --output "$epubcheck_archive" \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          echo "6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5  $epubcheck_archive" \
            | sha256sum --check
          unzip -q "$epubcheck_archive" -d "$RUNNER_TEMP/epubcheck"
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck/epubcheck-5.3.0/epubcheck.jar" >> "$GITHUB_ENV"

          chrome_archive="$RUNNER_TEMP/chrome-headless-shell-151.0.7922.34.zip"
          curl --fail --location --silent --show-error \
            --output "$chrome_archive" \
            https://storage.googleapis.com/chrome-for-testing-public/151.0.7922.34/linux64/chrome-headless-shell-linux64.zip
          echo "3cfc2bd00d1bafcf8a68dc74c9c92bb7150ddc8d26ade948a776316e1cec4f14  $chrome_archive" \
            | sha256sum --check
          unzip -q "$chrome_archive" -d "$RUNNER_TEMP/chrome"
          chrome="$RUNNER_TEMP/chrome/chrome-headless-shell-linux64/chrome-headless-shell"
          test -x "$chrome"
          echo "OINK_CHROME=$chrome" >> "$GITHUB_ENV"

      - name: Package and validate the Book fixture
        shell: bash
        run: |
          public="$RUNNER_TEMP/oink-book-public"
          epub="$RUNNER_TEMP/oink-book.epub"
          pdf="$RUNNER_TEMP/oink-book.pdf"
          hugo --source tests/site --themesDir "$GITHUB_WORKSPACE/.." \
            --destination "$public" --minify --printPathWarnings --panicOnWarning
          python3 bin/book-epub.py \
            --manifest "$public/book/book.json" \
            --public "$public" \
            --metadata tests/fixtures/book/metadata.yaml \
            --output "$epub"
          python3 bin/check-book-epub.py "$epub" \
            --manifest "$public/book/book.json"
          java -jar "$EPUBCHECK_JAR" "$epub"
          python3 - "$public/_print/book/index.html" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          probe = (
              '<p id="td-pdf-js-probe">OINK_JS_DISABLED</p>'
              '<script>document.getElementById("td-pdf-js-probe").textContent="OINK_JS_EXECUTED"</script>'
          )
          if "</main>" not in source:
              raise SystemExit("Print fixture has no </main> for the JavaScript probe")
          path.write_text(source.replace("</main>", probe + "</main>", 1), encoding="utf-8")
          PY
          python3 bin/book-pdf.py \
            --manifest "$public/book/book.json" \
            --public "$public" \
            --chrome "$OINK_CHROME" \
            --output "$pdf"
          python3 bin/check-book-pdf.py "$pdf" \
            --manifest "$public/book/book.json"
          pdf_text="$RUNNER_TEMP/oink-book.txt"
          pdftotext "$pdf" "$pdf_text"
          grep -q OINK_JS_DISABLED "$pdf_text"
          if grep -q OINK_JS_EXECUTED "$pdf_text"; then
            echo "PDF JavaScript probe executed despite the disabled-script contract" >&2
            exit 1
          fi

          subpath_public="$RUNNER_TEMP/oink-book-subpath-public"
          subpath_epub="$RUNNER_TEMP/oink-book-subpath.epub"
          subpath_pdf="$RUNNER_TEMP/oink-book-subpath.pdf"
          hugo --source tests/site --themesDir "$GITHUB_WORKSPACE/.." \
            --destination "$subpath_public" --baseURL https://example.org/subpath/ \
            --minify --printPathWarnings --panicOnWarning
          python3 bin/book-epub.py \
            --manifest "$subpath_public/book/book.json" \
            --public "$subpath_public" \
            --metadata tests/fixtures/book/metadata.yaml \
            --output "$subpath_epub"
          python3 bin/check-book-epub.py "$subpath_epub" \
            --manifest "$subpath_public/book/book.json"
          java -jar "$EPUBCHECK_JAR" "$subpath_epub"
          python3 bin/book-pdf.py \
            --manifest "$subpath_public/book/book.json" \
            --public "$subpath_public" \
            --chrome "$OINK_CHROME" \
            --output "$subpath_pdf"
          python3 bin/check-book-pdf.py "$subpath_pdf" \
            --manifest "$subpath_public/book/book.json"

  build:
    name: Hugo ${{ matrix.hugo-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hugo-version: ['0.160.1', '0.164.0']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ matrix.hugo-version }}
          extended: true

      - name: Check translation key parity
        run: python3 bin/check-i18n.py

      - name: Check opt-in taxonomy localization
        run: python3 bin/check-taxonomy.py

      - name: Verify vendored dependency inventory
        run: python3 bin/check-vendor.py

      - name: Check typography token boundaries
        run: python3 bin/check-font-tokens.py

      - name: Check navigation contracts and characterization
        run: python3 bin/check-navigation-contract.py

      - name: Check runtime isolation
        run: python3 bin/check-runtime-isolation.py

      - name: Check sidebar icon density policies
        run: python3 bin/check-sidebar-icons.py

      - name: Check search metadata and ranking
        run: python3 bin/check-search.py

      - name: Check action registry and command manifest
        run: python3 bin/check-actions.py

      - name: Check Command Palette modes and behavior
        run: python3 bin/check-palette.py

      - name: Check starter root and subpath output
        run: python3 bin/check-starter.py

      - name: Check reading and mathematics
        run: python3 bin/check-reading.py

      - name: Check releases and assets
        run: python3 bin/check-release-assets.py

      - name: Check download data
        run: python3 bin/check-download.py

      - name: Check Landing surfaces
        run: python3 bin/check-landing.py

      - name: Check Book surfaces
        run: python3 bin/check-book.py

      - name: Check Book migrations
        run: python3 bin/check-book-migrations.py

      - name: Check shared scenarios
        run: python3 bin/check-shared-scenarios.py

      - name: Check keyboard navigation
        run: python3 bin/check-keyboard.py

      - name: Check navigation and page-end composition
        run: python3 bin/check-shell.py

      - name: Check the page annotation and upstream attribution contract
        run: python3 bin/check-annotation.py

      - name: Build the regression fixture without warnings
        working-directory: tests/site
        run: hugo --themesDir "$GITHUB_WORKSPACE/.." --printPathWarnings --panicOnWarning

      # The regression fixture loads this checkout as a classic theme; the
      # published form is a Hugo Module. Build one small site that imports the
      # module (replaced with this checkout) so module-only path resolution —
      # os.ReadFile in the include shortcode, mounted static assets, print —
      # is exercised on every run.
      - name: Build a consumer site in Hugo Module mode
        run: |
          site="$RUNNER_TEMP/oink-module-site"
          mkdir -p "$site/content/docs" "$site/content/snippets"
          cat > "$site/hugo.yaml" <<'YAML'
          baseURL: https://example.org/
          title: Module fixture
          module:
            imports:
              - path: github.com/pgsty/oink
          outputs:
            section: [HTML, print]
          params:
            offline_search: true
            ui:
              image_zoom: true
          YAML
          printf -- '---\ntitle: Docs\n---\n\nSection.\n' > "$site/content/docs/_index.md"
          printf -- 'included text\n' > "$site/content/snippets/part.md"
          printf -- '---\ntitle: Page\n---\n\n{{< include file="/snippets/part.md" >}}\n\n```filetree\n- a/\n  - b.txt\n```\n' > "$site/content/docs/page.md"
          HUGO_MODULE_REPLACEMENTS="github.com/pgsty/oink -> $GITHUB_WORKSPACE" \
            hugo --source "$site" --destination "$RUNNER_TEMP/oink-module-public" \
              --printPathWarnings --panicOnWarning
          grep -q 'included text' "$RUNNER_TEMP/oink-module-public/docs/page/index.html"
          test -f "$RUNNER_TEMP/oink-module-public/_print/docs/index.html"
          test -f "$RUNNER_TEMP/oink-module-public/webfonts/fa-solid-900.woff2"

      - name: Check enhanced code-block contracts
        run: python3 bin/check-code-blocks.py

      - name: Check everyday content primitives
        run: python3 bin/check-content-primitives.py

      - name: Check shared media primitives
        run: python3 bin/check-media-primitives.py

      - name: Check opt-in Image Zoom
        run: python3 bin/check-image-zoom.py

      - name: Check Gallery output and Zoom reuse
        run: python3 bin/check-gallery.py

      - name: Check v5 components (callouts, tabs, data fences, removed shortcodes)
        run: python3 bin/check-components.py

      - name: Check migration toolkit
        run: python3 -m unittest discover -s tests/migrations -t .

      - name: Check output structure and security
        run: python3 bin/check-output.py

      - name: Check the naming namespace
        run: python3 bin/check-namespace.py

      - name: Check the parameter contract and legacy-key errors
        run: python3 bin/check-params.py

      - name: Check consuming-site Goldmark prerequisites
        run: python3 bin/check-site-markup.py --site tests/site

      - name: Check four-state goldens
        run: python3 bin/check-goldens.py

      - name: Build the system typography preset
        working-directory: tests/site
        env:
          HUGO_PARAMS_UI_TYPOGRAPHY: system
        run: |
          hugo --themesDir "$GITHUB_WORKSPACE/.." --destination "$RUNNER_TEMP/oink-system" --printPathWarnings --panicOnWarning
          grep -R -q 'data-td-typography="system"' "$RUNNER_TEMP/oink-system"

      - name: Preserve legacy Sass font overrides
        run: |
          cp -R tests/site "$RUNNER_TEMP/oink-font-compat"
          mkdir -p "$RUNNER_TEMP/oink-font-compat/assets/scss"
          cp tests/fixtures/legacy-fonts/_variables_project.scss \
            "$RUNNER_TEMP/oink-font-compat/assets/scss/_variables_project.scss"
          hugo --source "$RUNNER_TEMP/oink-font-compat" \
            --themesDir "$(dirname "$GITHUB_WORKSPACE")" \
            --destination "$RUNNER_TEMP/oink-font-compat-public" \
            --printPathWarnings --panicOnWarning
          grep -R -q -- '--td-heading-font-family:Georgia, serif' \
            "$RUNNER_TEMP/oink-font-compat-public/scss"
          grep -R -q -- '--td-code-font-family:"Courier New", monospace' \
            "$RUNNER_TEMP/oink-font-compat-public/scss"
          grep -F -R -q -- \
            '[data-td-typography=system]{--bs-font-monospace:"Legacy Mono", monospace' \
            "$RUNNER_TEMP/oink-font-compat-public/scss"
          if grep -R -q -- '--td-heading-font-family:var(--td-print-font-family)' \
            "$RUNNER_TEMP/oink-font-compat-public/scss"; then
            echo "print preset unexpectedly replaced the legacy heading font" >&2
            exit 1
          fi

      - name: Reject an invalid typography preset
        working-directory: tests/site
        run: |
          # The theme never errorf's; an invalid preset warns and falls back so
          # `hugo server` survives it. --panicOnWarning is what turns that
          # warning back into a hard failure here, which is the contract.
          if HUGO_PARAMS_UI_TYPOGRAPHY=invalid \
            hugo --themesDir "$GITHUB_WORKSPACE/.." --printPathWarnings --panicOnWarning \
              --destination "$RUNNER_TEMP/oink-invalid" \
              >"$RUNNER_TEMP/oink-invalid.log" 2>&1; then
            echo "invalid typography preset unexpectedly built" >&2
            exit 1
          fi
          grep -q 'invalid params.ui.typography' "$RUNNER_TEMP/oink-invalid.log"
