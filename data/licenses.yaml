# SPDX identifier -> display name and canonical text URL, for the upstream
# attribution line of the page annotation (`upstream_license` front matter).
#
# The table is deliberately two columns. Every obligation that differs between
# these licenses -- the warranty disclaimer, the full license text, an upstream
# NOTICE file, a pinned snapshot -- belongs on the page named by
# `upstream_notice`, not in a footer line, so the theme does not model them.
#
# A site adds or overrides entries with its own `data/licenses.yaml`; Hugo
# merges the site file over this one, so only the changed identifiers need to
# be repeated.

CC-BY-4.0:
  name: CC BY 4.0
  url: https://creativecommons.org/licenses/by/4.0/
CC-BY-SA-4.0:
  name: CC BY-SA 4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/
CC-BY-3.0:
  name: CC BY 3.0
  url: https://creativecommons.org/licenses/by/3.0/
CC-BY-SA-3.0:
  name: CC BY-SA 3.0
  url: https://creativecommons.org/licenses/by-sa/3.0/
CC0-1.0:
  name: CC0 1.0
  url: https://creativecommons.org/publicdomain/zero/1.0/
MIT:
  name: MIT License
  url: https://opensource.org/license/mit
ISC:
  name: ISC License
  url: https://opensource.org/license/isc-license-txt
BSD-2-Clause:
  name: BSD 2-Clause License
  url: https://opensource.org/license/bsd-2-clause
BSD-3-Clause:
  name: BSD 3-Clause License
  url: https://opensource.org/license/bsd-3-clause
PostgreSQL:
  name: PostgreSQL License
  url: https://opensource.org/license/postgresql
Apache-2.0:
  name: Apache License 2.0
  url: https://www.apache.org/licenses/LICENSE-2.0
MPL-2.0:
  name: Mozilla Public License 2.0
  url: https://www.mozilla.org/en-US/MPL/2.0/
Artistic-2.0:
  name: Artistic License 2.0
  url: https://opensource.org/license/artistic-2-0
GPL-2.0-only:
  name: GNU General Public License v2.0
  url: https://www.gnu.org/licenses/old-licenses/gpl-2.0.html
GPL-3.0-only:
  name: GNU General Public License v3.0
  url: https://www.gnu.org/licenses/gpl-3.0.html
LGPL-2.1-only:
  name: GNU Lesser General Public License v2.1
  url: https://www.gnu.org/licenses/old-licenses/lgpl-2.1.html
AGPL-3.0-only:
  name: GNU Affero General Public License v3.0
  url: https://www.gnu.org/licenses/agpl-3.0.html
GFDL-1.3-only:
  name: GNU Free Documentation License v1.3
  url: https://www.gnu.org/licenses/fdl-1.3.html
OFL-1.1:
  name: SIL Open Font License 1.1
  url: https://openfontlicense.org/
Unlicense:
  name: The Unlicense
  url: https://unlicense.org/
