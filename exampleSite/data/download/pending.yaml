version: 3.0.0-rc.1
repo: pgsty/oink
tag: v3.0.0-rc.1
published: false
channels:
  - id: repository
    kind: rolling
    title: Package repository
    note: The rolling repository remains available while the pinned candidate is unpublished.
    url: https://repo.example.org/oink/
    steps:
      - code: curl -fsSL https://repo.example.org/oink/install | bash
        lang: bash
  - id: candidate
    kind: pinned
    title: Release candidate
    url: https://github.com/pgsty/oink/releases/tag/${tag}
    steps:
      - code: curl -LO https://github.com/pgsty/oink/releases/download/${tag}/oink-${version}.tar.gz
        lang: bash
    checksums: |
      eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee  oink-3.0.0-rc.1.tar.gz
