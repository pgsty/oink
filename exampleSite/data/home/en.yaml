# This file is the page. `sections` is the running order; every key below it is
# one block. Delete an entry and the block goes, move an entry and the block
# moves. A map entry can point at a differently named data block with `key`,
# which is how the three logo walls below share a single section type.
sections:
  - hero
  - metrics
  - capabilities
  - cards
  - type: logo-wall
    key: components
  - type: logo_wall
    key: ecosystem
  - gallery
  - testimonials
  - contributors
  - faq
  - markdown
  - principles
  - type: logo-wall
    key: showcase
  - cta

hero:
  eyebrow: Hugo-only · Local-first · Zero npm
  # Two title lines; each renders as its own block and does not wrap.
  title_lines:
    - Plain Markdown in.
    - Modern docs out.
  desc: >
    Search, i18n, versioning, charts, and math — built into the theme.
    The entire build step is one command: `hugo`.
  note: No npm, CDN, or JavaScript framework required.
  actions:
    - label: Browse the components
      url: docs/
      icon: fa-solid fa-book-open
      style: primary
    - label: Read this page's YAML
      url: https://github.com/pgsty/oink/blob/main/exampleSite/data/home/en.yaml
      icon: fa-solid fa-file-code
      style: ghost
      external: true

metrics:
  eyebrow: Count it yourself
  title: What this page cost
  desc: Four numbers, all of them checkable against the repository.
  columns: 4
  items:
    - value: 1
      label: Data file
      desc: '`data/home/en.yaml`'
      icon: fa-solid fa-file-code
    - value: 14
      label: Blocks on this page
      desc: from a registry of 22 section types
      icon: fa-solid fa-layer-group
    - value: 0
      label: Templates edited
      desc: order is data, not markup
      icon: fa-solid fa-code
    - value: 0
      label: Runtime dependencies
      desc: no npm, no CDN, no PostCSS
      icon: fa-solid fa-plug

capabilities:
  eyebrow: How it works
  title: The section list is the layout
  desc: One dispatcher reads the array; each entry renders through its own partial.
  items:
    - ref: 01 / SECTION LIST
      title: Move a line, move a section
      url: https://gohugo.io/templates/partial/
      external: true
      motto: One dispatcher, one partial per section type
      bullets:
        - Name a section in the `sections` array and it renders.
        - Point two entries at different `key` values to reuse one type.
        - 'Take a block down with `enabled: false` — no deletion required.'
      value: Page structure is data. Reordering it is a text edit, not a template change.
      visual:
        type: code
        title: data/home/en.yaml
        aria_label: Landing page section configuration
        lines:
          - { class: c, prefix: '# ', text: this page, in order }
          - { class: p, prefix: '- ', text: hero }
          - { class: ok, prefix: '- ', text: metrics }
          - { class: ok, prefix: '- ', text: capabilities }

cards:
  eyebrow: Cards
  title: Three map entries, three cards
  desc: The general-purpose collection — features, benefits, services, any short list of things.
  columns: 3
  link_label: Learn more
  items:
    - name: Markdown-aware
      icon: fa-brands fa-markdown
      meta: Rich text
      desc: Descriptions carry **emphasis**, `code`, and [links](https://commonmark.org/).
      url: https://commonmark.org/
      external: true
    - name: Link-optional
      icon: fa-solid fa-link-slash
      meta: Robust data
      desc: This card has no `url`, and is still valid, readable content.
    - name: Reusable
      icon: fa-solid fa-repeat
      meta: Multiple instances
      desc: Two entries, one `type`, different `key` — the pattern used three times below.

components:
  eyebrow: Component reference
  title: Twenty-one components, loaded only where used
  text:
    Each has its own page and a defined shape in HTML, print, Markdown and RSS.
    The runtime behind a chart, a diagram, or a terminal cast ships on the pages
    that use it and nowhere else — this landing page loads none of them.
  layout: grid
  columns: 3
  # Ordered by distinctiveness: the ones you rarely find elsewhere first,
  # then the ones you reach for every day.
  items:
    - { title: ECharts,     icon: fa-solid fa-chart-line,           desc: '`echarts` data fence',          url: docs/echarts/ }
    - { title: Infographic, icon: fa-solid fa-chart-pie,            desc: 'declarative AntV templates',    url: docs/infographic/ }
    - { title: Markmap,     icon: fa-solid fa-sitemap,              desc: 'mind maps from an outline',     url: docs/markmap/ }
    - { title: Asciinema,   icon: fa-solid fa-terminal,             desc: 'terminal casts, local player',  url: docs/asciinema/ }
    - { title: PlantUML,    icon: fa-solid fa-project-diagram,      desc: 'UML through your own server',   url: docs/plantuml/ }
    - { title: Draw.io,     icon: fa-solid fa-pen-ruler,            desc: 'diagrams that stay editable',   url: docs/drawio/ }
    - { title: Mermaid,     icon: fa-solid fa-diagram-project,      desc: 'local diagram runtime',         url: docs/mermaid/ }
    - { title: Mathematics, icon: fa-solid fa-square-root-variable, desc: 'KaTeX at build time',           url: docs/math/ }
    - { title: File trees,  icon: fa-solid fa-folder-tree,          desc: '`filetree` data fence',         url: docs/filetree/ }
    - { title: Galleries,   icon: fa-solid fa-images,               desc: '`gallery` data fence',          url: docs/gallery/ }
    - { title: Code blocks, icon: fa-solid fa-code,                 desc: 'Chroma · lines · copy · fold',  url: docs/code/ }
    - { title: Images,      icon: fa-solid fa-image,                desc: 'captions · sizing · zoom',      url: docs/image/ }
    - { title: Tables,      icon: fa-solid fa-table,                desc: 'captions · numbers · matrix',   url: docs/table/ }
    - { title: Fields,      icon: fa-solid fa-table-list,           desc: 'a table plus `{.fields}`',      url: docs/fields/ }
    - { title: Callouts,    icon: fa-solid fa-circle-info,          desc: '`> [!NOTE]` · 10 types',        url: docs/callout/ }
    - { title: Tabs,        icon: fa-solid fa-folder,               desc: 'fences with `{tab=}`',          url: docs/tabs/ }
    - { title: Steps,       icon: fa-solid fa-list-ol,              desc: 'a list plus `{.steps}`',        url: docs/steps/ }
    - { title: Cards,       icon: fa-solid fa-table-cells-large,    desc: 'a list plus `{.cards}`',        url: docs/cards/ }
    - { title: Badges,      icon: fa-solid fa-tag,                  desc: 'inline status, five tones',     url: docs/badge/ }
    - { title: Keys,        icon: fa-solid fa-keyboard,             desc: 'key names and chords',          url: docs/kbd/ }
    - { title: Include,     icon: fa-solid fa-file-import,          desc: 'files, params, build-time notes', url: docs/include/ }

ecosystem:
  eyebrow: Dependencies
  title: The complete list, not an excerpt
  desc: 'Nothing else is installed, downloaded, or phoned home to. `icon` takes a Font Awesome class, an image path, or a bare symbol.'
  columns: 4
  items:
    - { name: Hugo Extended, desc: The only build tool, icon: fa-solid fa-bolt, url: https://gohugo.io/, external: true }
    - { name: Markdown, desc: The content format, icon: fa-brands fa-markdown, url: https://commonmark.org/, external: true }
    - { name: Git, desc: The whole pipeline, icon: fa-brands fa-git-alt }
    - { name: Nothing else, desc: No lockfile to audit, icon: ◉ }

