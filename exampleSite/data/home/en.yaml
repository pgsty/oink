# OINK composes the homepage in exactly this order. Remove, reorder, or disable
# any entry without changing a template. A map entry can point at a differently
# named data block with `key`, which also allows multiple instances of one type.
sections:
  - hero
  - metrics
  - capabilities
  - cards
  - type: logo-wall
    key: components
  - type: logo_wall
    key: ecosystem
  - gallery
  - testimonials
  - contributors
  - faq
  - markdown
  - principles
  - type: logo-wall
    key: showcase
  - cta

hero:
  eyebrow: Composable · Local-first · Hugo-only
  title: Build **clearer** documentation.
  desc: OINK turns `data/home.yaml` into a landing page. Ordinary text fields support [Markdown links](https://gohugo.io/content-management/data-sources/).
  note: No npm, CDN, or JavaScript framework required.
  actions:
    - label: Read the docs
      url: docs/
      icon: fa-solid fa-book-open
      style: primary
    - label: View on GitHub
      url: https://github.com/pgsty/oink
      icon: fa-brands fa-github
      style: ghost
      external: true

metrics:
  eyebrow: At a glance
  title: Small surface, broad reach
  desc: Metrics accept optional links and supporting text.
  columns: 4
  items:
    - { value: 12, label: Section types, icon: fa-solid fa-layer-group }
    - { value: 1, label: Data file, icon: fa-solid fa-file-code }
    - { value: 0, label: Runtime dependencies, icon: fa-solid fa-plug }
    - { value: 100%, label: Hugo-rendered, icon: fa-solid fa-bolt }

capabilities:
  eyebrow: Existing specialist section
  title: Keep the expressive layouts
  desc: Complex feature rows remain configurable alongside the new generic sections.
  items:
    - ref: 01 / SECTION DISPATCH
      title: Reorder without editing HTML
      url: https://gohugo.io/templates/partial/
      external: true
      motto: A small dispatcher, independent partials
      bullets:
        - Put Section names in the `sections` array.
        - Use `key` to reuse one type with different data.
        - 'Set `enabled: false` for temporary removal.'
      value: Structure is data now, not a hard-coded template.
      visual:
        type: code
        title: data/home.yaml
        aria_label: Landing page section configuration
        lines:
          - { class: c, prefix: '# ', text: compose the page }
          - { class: p, prefix: '- ', text: hero }
          - { class: ok, prefix: '- ', text: logo_wall }
          - { class: ok, prefix: '- ', text: faq }

cards:
  eyebrow: Generic cards
  title: Configure the common case
  desc: Use cards for features, benefits, services, or any short collection.
  columns: 3
  link_label: Learn more
  items:
    - name: Markdown-aware
      icon: fa-brands fa-markdown
      meta: Rich text
      desc: Descriptions can contain **emphasis**, `code`, and [links](https://commonmark.org/).
      url: https://commonmark.org/
      external: true
    - name: Link-optional
      icon: fa-solid fa-link-slash
      meta: Robust data
      desc: Leave out `url` and the card remains valid, readable content.
    - name: Reusable
      icon: fa-solid fa-repeat
      meta: Multiple instances
      desc: Point two Section entries at different keys with the same `type`.

components:
  eyebrow: Component reference
  title: Engineering content, loaded on demand
  text: Each component has its own page and a defined shape in HTML, print, Markdown and RSS.
  layout: grid
  columns: 3
  # Ordered by distinctiveness: the ones you rarely find elsewhere first,
  # then the ones you reach for every day.
  items:
    - { title: ECharts,     icon: fa-solid fa-chart-line,           desc: '`echarts` data fence',          url: docs/echarts/ }
    - { title: Infographic, icon: fa-solid fa-chart-pie,            desc: 'declarative AntV templates',    url: docs/infographic/ }
    - { title: Markmap,     icon: fa-solid fa-sitemap,              desc: 'mind maps from an outline',     url: docs/markmap/ }
    - { title: Asciinema,   icon: fa-solid fa-terminal,             desc: 'terminal casts, local player',  url: docs/asciinema/ }
    - { title: PlantUML,    icon: fa-solid fa-project-diagram,      desc: 'UML through your own server',   url: docs/plantuml/ }
    - { title: Draw.io,     icon: fa-solid fa-pen-ruler,            desc: 'diagrams that stay editable',   url: docs/drawio/ }
    - { title: Mermaid,     icon: fa-solid fa-diagram-project,      desc: 'local diagram runtime',         url: docs/mermaid/ }
    - { title: Mathematics, icon: fa-solid fa-square-root-variable, desc: 'KaTeX at build time',           url: docs/math/ }
    - { title: File trees,  icon: fa-solid fa-folder-tree,          desc: '`filetree` data fence',         url: docs/filetree/ }
    - { title: Galleries,   icon: fa-solid fa-images,               desc: '`gallery` data fence',          url: docs/gallery/ }
    - { title: Code blocks, icon: fa-solid fa-code,                 desc: 'Chroma · lines · copy · fold',  url: docs/code/ }
    - { title: Images,      icon: fa-solid fa-image,                desc: 'captions · sizing · zoom',      url: docs/image/ }
    - { title: Tables,      icon: fa-solid fa-table,                desc: 'captions · numbers · matrix',   url: docs/table/ }
    - { title: Fields,      icon: fa-solid fa-table-list,           desc: 'a table plus `{.fields}`',      url: docs/fields/ }
    - { title: Callouts,    icon: fa-solid fa-circle-info,          desc: '`> [!NOTE]` · 10 types',        url: docs/callout/ }
    - { title: Tabs,        icon: fa-solid fa-folder,               desc: 'fences with `{tab=}`',          url: docs/tabs/ }
    - { title: Steps,       icon: fa-solid fa-list-ol,              desc: 'a list plus `{.steps}`',        url: docs/steps/ }
    - { title: Cards,       icon: fa-solid fa-table-cells-large,    desc: 'a list plus `{.cards}`',        url: docs/cards/ }
    - { title: Badges,      icon: fa-solid fa-tag,                  desc: 'inline status, five tones',     url: docs/badge/ }
    - { title: Keys,        icon: fa-solid fa-keyboard,             desc: 'key names and chords',          url: docs/kbd/ }
    - { title: Include,     icon: fa-solid fa-file-import,          desc: 'files, params, build-time notes', url: docs/include/ }

