contributors:
  eyebrow: Contributors
  title: Credit the people, not the tooling
  desc: Production sites point `icon` at an avatar image; single letters keep this example self-contained.
  columns: 3
  items:
    - { name: Alex, icon: A, desc: Theme architecture, url: https://github.com/ }
    - { name: Bo, icon: B, desc: Accessibility review }
    - { name: Casey, icon: C, desc: Documentation and examples }

faq:
  eyebrow: FAQ
  title: What people ask about this page
  desc: Answers are block Markdown, so lists and multiple paragraphs work as written.
  items:
    - question: Is it really one file?
      answer: >
        Everything between the navbar and the footer is. Navigation comes from
        `hugo.yaml`, the footer from `data/footer/en.yaml`, and every block in
        between from `data/home/en.yaml`.
      open: true
    - question: Does each language need its own file?
      answer: A single-language site can use one `data/home.yaml`. This site is bilingual, so it uses `data/home/en.yaml` and `data/home/zh.yaml`.
    - question: Can one section type appear more than once?
      answer: |
        Yes — give each entry a different `key`:

        - `{ type: gallery, key: products }`
        - `{ type: gallery, key: case_studies }`

        The three logo walls on this page are one section type reading three different blocks.
    - question: What happens when `url` is missing?
      answer: The item renders as ordinary content — no empty link, no broken link. Two of the three cards above have no `url`.

markdown:
  eyebrow: Free-form Markdown
  title: The escape hatch
  desc: When no predefined collection fits, write Markdown straight into the data file.
  body: |
    This paragraph is a `body:` string in the same YAML file as everything above it. It takes paragraphs, [links](https://gohugo.io/), and lists:

    - no custom template;
    - ordinary Goldmark rendering;
    - the same width and vertical rhythm as every other block.

principles:
  eyebrow: Principles
  title: Predictable by design
  columns: 3
  items:
    - icon: fa-solid fa-sliders
      title: Content first
      desc: Most changes are plain text in a data file.
    - icon: fa-solid fa-universal-access
      title: Accessible defaults
      desc: Semantic sections, guarded external links, and native FAQ disclosure controls.
    - icon: fa-solid fa-code-branch
      title: Backward compatible
      desc: Home data without a `sections` list keeps the order it always had.

