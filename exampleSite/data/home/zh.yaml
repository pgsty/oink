  eyebrow: 贡献者
  title: 记下背后的人
  desc: 生产站点用图片作头像；这里用符号，示例因此自成一体。
  columns: 3
  items:
    - { name: Alex, icon: A, desc: 主题架构, url: https://github.com/ }
    - { name: Bo, icon: B, desc: 无障碍审阅 }
    - { name: Casey, icon: C, desc: 文档与示例 }

faq:
  eyebrow: 常见问题
  title: 大家都会问的几件事
  desc: 答案是块级 Markdown，列表与多个段落都能照常使用。
  items:
    - question: 可以只用一个 `data/home.yaml` 吗？
      answer: 可以。单语言站点用一个文件即可；多语言站点用 `data/home/en.yaml`、`data/home/zh.yaml` 这样的形式。
      open: true
    - question: 同一种区块可以出现多次吗？
      answer: |
        可以，给每个条目不同的 `key`：

        - `{ type: gallery, key: products }`
        - `{ type: gallery, key: case_studies }`
    - question: 没写 `url` 会怎样？
      answer: 这一项按普通内容渲染，不会留下空链接或坏链接。

markdown:
  eyebrow: 自由 Markdown
  title: 特殊内容的逃生口
  desc: 预定义的集合表达不了时，用 Markdown 区块。
  body: |
    这一整块都由数据渲染而来，支持段落、[链接](https://gohugo.io/)与列表：

    - 不需要自定义模板；
    - 就是普通的 Goldmark 渲染；
    - 与落地页其余部分同样的宽度与节奏。

principles:
  eyebrow: 设计原则
  title: 行为可预期
  columns: 3
  items:
    - icon: fa-solid fa-sliders
      title: 内容优先
      desc: 多数改动只是 YAML 里的纯文本。
    - icon: fa-solid fa-universal-access
      title: 默认无障碍
      desc: 语义化区块、受控的外链，以及原生的 FAQ 折叠控件。
    - icon: fa-solid fa-code-branch
      title: 向后兼容
      desc: 没有 `sections` 时，既有的首页数据保持原来的顺序。

cta:
  title: 拼出你自己的落地页。
  desc: 拷走这个文件，换掉示例内容，重排区块列表。
  label: 开始使用
  url: docs/
  style: primary
