    - { name: 离线, desc: 一切都在本地, icon: ◉ }

gallery:
  eyebrow: 画廊
  title: 展示页面、产品或示例
  desc: 用 `image` 给出截图；素材还没准备好时先用图标顶上。
  columns: 3
  link_label: 打开示例
  items:
    - title: 文档门户
      badge: 信息架构
      icon: fa-solid fa-book
      desc: 给[文档](docs/)一个明确的入口。
      url: docs/
