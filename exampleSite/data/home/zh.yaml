# OINK 按这个顺序拼出首页。增删、重排、关闭任何一节都不用改模板。
# 映射形式的条目可以用 `key` 指向另一个数据块，同一种类型因此可以出现多次。
sections:
  - hero
  - metrics
  - capabilities
  - cards
  - type: logo-wall
    key: components
  - type: logo_wall
    key: ecosystem
  - gallery
  - testimonials
  - contributors
  - faq
  - markdown
  - principles
  - type: logo-wall
    key: showcase
  - cta

hero:
  eyebrow: 可组合 · 本地优先 · 只需 Hugo
  title: 把文档写得**更清楚**。
  desc: OINK 把 `data/home.yaml` 变成一张落地页。普通文本字段支持 [Markdown 链接](https://gohugo.io/content-management/data-sources/)。
  note: 不需要 npm、CDN 或任何 JavaScript 框架。
  actions:
    - label: 阅读文档
      url: docs/
      icon: fa-solid fa-book-open
      style: primary
    - label: 在 GitHub 上查看
      url: https://github.com/pgsty/oink
      icon: fa-brands fa-github
      style: ghost
      external: true

metrics:
  eyebrow: 一眼看完
  title: 表面很小，覆盖很广
  desc: 指标可以带链接与补充说明。
  columns: 4
  items:
    - { value: 12, label: 区块类型, icon: fa-solid fa-layer-group }
    - { value: 1, label: 数据文件, icon: fa-solid fa-file-code }
    - { value: 0, label: 运行时依赖, icon: fa-solid fa-plug }
    - { value: 100%, label: 由 Hugo 渲染, icon: fa-solid fa-bolt }

capabilities:
  eyebrow: 原有的专用区块
  title: 保留富有表现力的版式
  desc: 复杂的特性行仍然可配置，与新的通用区块并存。
  items:
    - ref: 01 / 区块分发
      title: 重排顺序不必改 HTML
      url: https://gohugo.io/templates/partial/
      external: true
      motto: 一个小分发器，一组独立的 partial
      bullets:
        - 把区块名字写进 `sections` 数组。
        - 用 `key` 让同一种类型指向不同数据。
        - '临时下线写 `enabled: false`。'
      value: 结构现在是数据，不再是写死的模板。
      visual:
        type: code
        title: data/home.yaml
        aria_label: 落地页区块配置
        lines:
          - { class: c, prefix: '# ', text: 拼出这一页 }
          - { class: p, prefix: '- ', text: hero }
          - { class: ok, prefix: '- ', text: logo_wall }
          - { class: ok, prefix: '- ', text: faq }

cards:
  eyebrow: 通用卡片
  title: 常见情况直接配置
  desc: 特性、优势、服务，任何一组短内容都可以用卡片。
  columns: 3
  link_label: 了解更多
  items:
    - name: 支持 Markdown
      icon: fa-brands fa-markdown
      meta: 富文本
      desc: 描述里可以写**强调**、`代码`与[链接](https://commonmark.org/)。
      url: https://commonmark.org/
      external: true
    - name: 链接可省略
      icon: fa-solid fa-link-slash
      meta: 数据健壮
      desc: 不写 `url`，卡片仍然是有效、可读的内容。
    - name: 可复用
      icon: fa-solid fa-repeat
      meta: 多个实例
      desc: 两个区块条目用同一种 `type`，指向不同的 `key`。

