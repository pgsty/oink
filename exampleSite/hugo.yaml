baseURL: https://example.org/
title: OINK Landing Example
theme: oink
defaultContentLanguage: en
enableRobotsTXT: true
disableKinds: [RSS, sitemap, taxonomy, term]

# Hugo does not merge a theme module's Goldmark configuration into a consumer
# site. Sites that author delimiter-style mathematics must enable passthrough
# themselves; OINK supplies the render hook and local KaTeX presentation.
markup:
  goldmark:
    parser:
      attribute:
        block: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]

outputs:
  section: [HTML, print]

params:
  description: A complete example of OINK's composable landing page.
  github_project_repo: https://github.com/pgsty/oink
  copyright:
    authors: '[OINK](https://oink.pgsty.com)'
    from_year: 2026
  offlineSearch: true
  offlineSearchIndex: summary
  offlineSearchSummaryLength: 80
  offlineSearchMaxResults: 10
  ui:
    showLightDarkModeMenu: true
    section_index: cards
    quick_links: [docs, blog]
    sidebar_icon_policy: groups
    page_context_menu:
      assistant_links: true
    image_zoom:
      enable: true
    feedback:
      enable: false

languages:
  en:
    label: English
    weight: 1
    params:
      ui:
        command_palette:
          commands:
            - id: example_status
              title: Example service status
              description: Open the example status page
              url: https://status.example.org/
              icon: fa-solid fa-signal
              keywords: [uptime, incident]
            - id: print_example
              title: Print this page
              action: print
              icon: fa-solid fa-print
              keywords: [paper, pdf]
            - id: example_docs
              title: Open content primitives
              description: Navigate within the example site
              url: /docs/content-primitives/
              icon: fa-solid fa-puzzle-piece
              keywords: [component, authoring]

menus:
  main:
    - identifier: docs
      name: Documentation
      pageRef: /docs
      weight: 10
    - identifier: primitives
      parent: docs
      name: Content primitives
      pageRef: /docs/content-primitives
      weight: 10
      params:
        icon: fa-solid fa-puzzle-piece
        description: Semantic authoring components
    - identifier: typography
      parent: docs
      name: Typography
      pageRef: /docs/typography
      weight: 20
      params:
        icon: fa-solid fa-font
        description: Theme typography roles
    - identifier: blog
      name: Blog
      pageRef: /blog
      weight: 20
    - identifier: source
      name: Source
      url: https://github.com/pgsty/oink
      weight: 30
      params:
        icon: fa-brands fa-github
