baseURL: https://example.org/
title: Oink Example
theme: oink
defaultContentLanguage: en
enableRobotsTXT: true
disableKinds: [sitemap, taxonomy, term]

# Hugo does not merge a theme module's Goldmark configuration into a consumer
# site. Sites that author delimiter-style mathematics must enable passthrough
# themselves; OINK supplies the render hook and local KaTeX presentation.
markup:
  goldmark:
    renderer:
      unsafe: true # `%` container shortcodes emit HTML that Goldmark must keep
    parser:
      wrapStandAloneImageWithinParagraph: false # native Book figures need block image attributes
      attribute:
        block: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]

outputs:
  home: [HTML, LLMS]
  section: [HTML, print, RSS]

params:
  description: A complete example of OINK's composable landing page.
  github_project_repo: https://github.com/pgsty/oink
  # The site-wide social card. A page that names no image of its own shares
  # this one; it is never rendered as a per-page thumbnail. Sections that want
  # their own default cascade `images` instead (see content/blog/_index.md).
  images: [/images/oink.webp]
  # Printed by the `param` shortcode on the component reference. `version`
  # names the published variant; `tdVersion.latest` is the resolvable release
  # ref that install commands interpolate.
  version: v0.5.0
  tdVersion:
    latest: v0.5.0
  hugoMinVersion: 0.160.1
  copyright:
    authors: '[OINK](https://oink.pgsty.com)'
    from_year: 2026
  offline_search: true
  offline_search_index: summary
  offline_search_summary_length: 80
  offline_search_max_results: 10
  # Diagram runtimes used by the component reference. PlantUML and Draw.io
  # render through a server the site names explicitly; the theme fails the
  # build rather than reaching out to an unconfigured default.
  markmap: true
  plantuml:
    enable: true
    svg_image_url: https://www.plantuml.com/plantuml/svg/
    svg: false
  drawio:
    enable: true
    drawio_server: https://embed.diagrams.net/
  ui:
    github_stars: 2189
    dark_mode:
      show_menu: true
    section_index: cards
    book_draft_banner: true
    sidebar_headings: 3
    quick_links: [docs, blog]
    sidebar_icon_policy: all
    page_context_menu:
      assistant_links: true
    image_zoom: true
    feedback: false

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: Oink Example
    params:
      description: A complete example of OINK's composable landing page.
      ui:
        command_palette:
          commands:
            - id: example_status
              title: Example service status
              description: Open the example status page
              url: https://status.example.org/
              icon: fa-solid fa-signal
              keywords: [uptime, incident]
            - id: print_example
              title: Print this page
              action: print
              icon: fa-solid fa-print
              keywords: [paper, pdf]
            - id: example_docs
              title: Open the callout page
              description: Navigate within the example site
              url: /docs/callout/
              icon: fa-solid fa-puzzle-piece
              keywords: [component, authoring]
    menus:
      main:
        - identifier: docs
          name: Docs
          pageRef: /docs
          weight: 10
          params:
            columns: 2
        - identifier: callout
          parent: docs
          name: Callouts
          pageRef: /docs/callout
          weight: 10
          params:
            icon: fa-solid fa-circle-info
            description: Notes, warnings and disclosures from a blockquote
        - identifier: code
          parent: docs
          name: Code blocks
          pageRef: /docs/code
          weight: 20
          params:
            icon: fa-solid fa-code
            description: Titles, copy, line numbers, folding
        - identifier: table
          parent: docs
          name: Tables
          pageRef: /docs/table
          weight: 30
          params:
            icon: fa-solid fa-table
            description: Captions, matrices, field lists, tabs
        - identifier: mermaid
          parent: docs
          name: Mermaid
          pageRef: /docs/mermaid
          weight: 40
          params:
            icon: fa-solid fa-diagram-project
            description: Diagrams rendered from text, locally
        - identifier: blog
          name: Blog
          pageRef: /blog
          weight: 20
        - identifier: pigsty
          name: Pigsty
          url: https://pigsty.com/
          weight: 30
          params:
            icon: fa-solid fa-database

  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: Oink 示例站
    params:
      description: OINK 可组合落地页的完整示例。
      time_format_blog: 2006年1月2日
      time_format_default: 2006年1月2日
      ui:
        command_palette:
          commands:
            - id: example_status
              title: 示例服务状态
              description: 打开示例状态页
              url: https://status.example.org/
              icon: fa-solid fa-signal
              keywords: [uptime, 可用性, 故障]
            - id: print_example
              title: 打印本页
              action: print
              icon: fa-solid fa-print
              keywords: [打印, pdf]
            - id: example_docs
              title: 打开提示块组件页
              description: 在示例站内跳转
              url: /zh/docs/callout/
              icon: fa-solid fa-puzzle-piece
              keywords: [组件, 写作]
    menus:
      main:
        - identifier: docs
          name: 文档
          pageRef: /docs
          weight: 10
          params:
            columns: 2
        - identifier: callout
          parent: docs
          name: 提示块
          pageRef: /docs/callout
          weight: 10
          params:
            icon: fa-solid fa-circle-info
            description: 用块引用写提示、警告与折叠
        - identifier: code
          parent: docs
          name: 代码块
          pageRef: /docs/code
          weight: 20
          params:
            icon: fa-solid fa-code
            description: 标题、复制、行号与折叠
        - identifier: table
          parent: docs
          name: 表格
          pageRef: /docs/table
          weight: 30
          params:
            icon: fa-solid fa-table
            description: 标题、矩阵、参数表与标签页
        - identifier: mermaid
          parent: docs
