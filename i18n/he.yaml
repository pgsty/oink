  {{ .Site.Title }} הוא פרוייקט קוד פתוח שכל אחד בקהילה יכול להשתמש, לשפר,
  ולהינות ממנו. אנחנו נשמח שתצטרף אלינו. הנה כמה דרכים להבין מה קורה פה ולהיות
  מעורב.
