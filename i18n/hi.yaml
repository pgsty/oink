# Community
community_join: >-
  {{ .Site.Title }} समुदाय में शामिल हों
community_introduce: >-
  {{ .Site.Title }} एक खुला स्रोत प्रोजेक्ट है जिसका समुदाय में कोई भी उपयोग कर
  सकता है, सुधार कर सकता है और आनंद ले सकता है। हम चाहेंगे कि आप हमारे साथ
  जुड़ें! क्या हो रहा है इसका पता लगाने और इसमें शामिल होने के कुछ तरीके यहां
  दिए गए हैं.
community_learn: सीखें और जुड़ें
community_using: >-
  {{ .Site.Title }} का उपयोग कर रहे हैं या करना चाहते हैं? यहां और जानें:
community_develop: विकास करें और योगदान दें
community_contribute: >-
  यदि आप {{ .Site.Title }} में योगदान देकर और अधिक शामिल होना चाहते हैं, तो यहां
  हमसे जुड़ें:
community_how_to: >-
  आप हमारे यहां {{ .Site.Title }} में योगदान करने का तरीका जान सकते हैं
community_guideline: >-
  योगदान दिशानिर्देश

