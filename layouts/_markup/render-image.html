{{- /*
  Image render hook (docs/components.md).

    ![alt](src "title")                 shared resolver (page resource → global
                                        resource → static → remote), lazy loading,
                                        intrinsic width/height for Hugo resources.
    standalone image + attribute line   {#id num="2-1" caption="…" width= height= .class}
                                        → <figure> (numbered = Book `fig` target)

  Inline images render a bare <img>; standalone images without caption / num
  render a bare block-level <img class="td-image"> (a wrapper element would be
  invalid HTML for a linked standalone image, which Hugo also reports as a
  block) and carry the explicit Image Zoom candidate marker in HTML output.
  Requires `markup.goldmark.parser.wrapStandAloneImageWithinParagraph: false`
  for the block form (site preflight); `title` keeps its Markdown meaning.
*/ -}}
{{- $page := .PageInner | default .Page -}}
{{- $format := lower ($page.Store.Get "tdOutputFormat" | default "html") -}}
{{- $destination := strings.TrimSpace .Destination -}}
{{- if not $destination }}{{ warnf "image: empty destination at %s; dropping the image" .Position }}{{ end -}}
{{- $alt := .PlainText | default "" -}}
{{- $title := .Title | default "" -}}
{{- $isBlock := .IsBlock -}}
{{- $image := partial "content/image-resolve.html" (dict
  "name" "image" "position" .Position "page" $page "src" $destination
  "hasAlt" true "alt" $alt "decorative" (eq $alt "")
) -}}
{{- $src := $image.src -}}
{{- $fullSrc := $image.fullSrc -}}
{{- if eq $format "rss" }}{{ $src = absURL $src }}{{ end -}}
{{- $width := $image.width -}}
{{- $height := $image.height -}}
{{- $figure := false -}}
{{- $href := "" -}}
{{- $external := false -}}
{{- $num := "" -}}
{{- $id := "" -}}
{{- $caption := "" -}}
{{- $classes := slice -}}
{{- $generic := dict -}}
{{- if $isBlock -}}
  {{- $policy := partial "content/attributes.html" (dict "attributes" .Attributes "allowed" (slice "id" "num" "caption" "width" "height" "link" "command" "options") "position" .Position "kind" "image") -}}
  {{- $classes = $policy.classes -}}
  {{- $generic = $policy.generic -}}
  {{- $caption = strings.TrimSpace (index $policy.consumed "caption" | default "") -}}
  {{- /* Hugo processing requires a processable local resource. */ -}}
  {{- $hasCommand := isset $policy.consumed "command" -}}
  {{- $hasOptions := isset $policy.consumed "options" -}}
  {{- if ne $hasCommand $hasOptions -}}
    {{- warnf "image: command and options must be given together at %s; ignoring both" .Position -}}
    {{- $hasCommand = false -}}
  {{- end -}}
  {{- if $hasCommand -}}
    {{- $processed := partial "content/image-process.html" (dict
      "name" "image" "position" .Position "image" $image
      "command" (index $policy.consumed "command") "options" (index $policy.consumed "options")
    ) -}}
    {{- $src = $processed.src -}}
    {{- if eq $format "rss" }}{{ $src = absURL $src }}{{ end -}}
    {{- $fullSrc = $processed.fullSrc -}}
    {{- $width = $processed.width -}}
    {{- $height = $processed.height -}}
  {{- end -}}
  {{- with index $policy.consumed "width" -}}
    {{- /* `int` would fail on a non-numeric value, so keep the resolved one. */ -}}
    {{- if not (findRE `^[1-9][0-9]*$` .) -}}
      {{- warnf "image: width must be a positive integer; got %q at %s; using the image's own width" . $.Position -}}
    {{- else -}}
      {{- $width = int . -}}
    {{- end -}}
  {{- end -}}
  {{- with index $policy.consumed "height" -}}
    {{- if not (findRE `^[1-9][0-9]*$` .) -}}
      {{- warnf "image: height must be a positive integer; got %q at %s; using the image's own height" . $.Position -}}
    {{- else -}}
      {{- $height = int . -}}
    {{- end -}}
  {{- end -}}
  {{- with index $policy.consumed "num" -}}
    {{- $num = partial "book/validate-num.html" (dict "name" "image" "value" . "position" $.Position) -}}
  {{- end -}}
  {{- with index $policy.consumed "id" -}}
    {{- $id = partial "book/validate-id.html" (dict "name" "image" "value" . "position" $.Position) -}}
  {{- end -}}
  {{- if $num -}}
    {{- if not $id }}{{ $id = printf "fig-%s" $num }}{{ end -}}
    {{- partial "book/register-target.html" (dict "page" $page "kind" "fig" "num" $num "id" $id "caption" $caption "position" .Position "ordinal" .Ordinal) -}}
  {{- end -}}
  {{- $figure = or $num $caption -}}
  {{- /* Bare linked images already have native Markdown syntax. */ -}}
  {{- with index $policy.consumed "link" -}}
    {{- if not $figure -}}
      {{- warnf "image: link requires caption or num; a linked image without a caption is written [![alt](src)](%s) at %s; dropping the link" . $.Position -}}
    {{- else -}}
      {{- $linkURL := partial "content/url.html" (dict
        "name" "image" "parameter" "link" "position" $.Position "value" . "kind" "link"
      ) -}}
      {{- $href = $linkURL.href -}}
      {{- $external = $linkURL.external -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $plainBlock := and $isBlock (not $figure) -}}
{{- /* Linked images are not Zoom candidates. */ -}}
{{- $zoomable := and $isBlock (eq $format "html") (ne $image.alt "") (eq $href "") -}}
{{- $genericAttrs := "" -}}
{{- if $plainBlock -}}
  {{- range $key, $value := $generic }}{{ $genericAttrs = printf `%s %s="%s"` $genericAttrs $key (htmlEscape $value) }}{{ end -}}
{{- end -}}
{{- /* A processed derivative points Zoom at the full-size source. */ -}}
{{- $zoomAttr := "" -}}
{{- if $zoomable -}}
  {{- $zoomAttr = cond (ne $fullSrc $src) (printf ` data-td-image-zoom="%s"` ($fullSrc | safeURL)) " data-td-image-zoom" -}}
{{- end -}}
{{- $img := printf `<img%s src="%s" alt="%s"%s%s%s%s loading="lazy" decoding="async"%s%s>`
  (cond $plainBlock (printf ` class="td-image%s"` (cond (gt (len $classes) 0) (printf " %s" (delimit $classes " ")) "")) "")
  ($src | safeURL) (htmlEscape $image.alt)
  (cond (ne $title "") (printf ` title="%s"` (htmlEscape $title)) "")
  (cond (gt $width 0) (printf ` width="%d"` $width) "")
  (cond (gt $height 0) (printf ` height="%d"` $height) "")
  $zoomAttr
  (cond (and $plainBlock (ne $id "")) (printf ` id="%s"` $id) "")
  $genericAttrs
-}}
{{- if or (not $isBlock) $plainBlock -}}
  {{- $img | safeHTML -}}
{{- else if $figure -}}
  {{- $figureClasses := slice "td-figure" -}}
  {{- if $num }}{{ $figureClasses = $figureClasses | append "td-book-figure" "td-book-figure--fig" }}{{ end -}}
  {{- $figureClasses = $figureClasses | append $classes -}}
  {{- $label := "" -}}
  {{- if $num }}{{ $label = partial "book/label.html" (dict "kind" "fig" "num" $num) }}{{ end -}}
<figure{{ with $id }} id="{{ . }}"{{ end }} class="{{ delimit $figureClasses " " }}"{{ if $num }} data-td-book-kind="fig" data-td-book-num="{{ $num }}"{{ end }}
  {{- range $key, $value := $generic }}{{ printf " %s=%q" $key $value | safeHTMLAttr }}{{ end }}>
  {{ if $href }}<a class="td-figure__link" href="{{ $href }}"{{ if $external }} rel="external"{{ end }}>{{ $img | safeHTML }}</a>{{ else }}{{ $img | safeHTML }}{{ end }}
  {{- /* Metadata never promotes a plain image to a figure. */ -}}
  <figcaption>{{ with $label }}<span class="td-fig-label">{{ . }}</span>{{ end }}{{ with $caption }} <span class="td-fig-caption">{{ . }}</span>{{ end }}{{ with $image.byline }}<small class="td-figure__byline">{{ . }}</small>{{ end }}</figcaption>
</figure>
{{- end -}}
