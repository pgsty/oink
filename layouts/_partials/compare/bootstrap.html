{{- if and (partialCached "compare/enabled.html" . .Site.Language.Lang .Site.BaseURL) (eq (lower (.Store.Get "tdOutputFormat" | default "html")) "html") -}}
<meta name="oink-compare-page" content="{{ .RelPermalink }}">
<script>
  (function () {
    try {
      var frame = window.frameElement;
      if (new URL(location.href).searchParams.get('oink_compare_pane') === '1' &&
          frame && frame.hasAttribute('data-td-compare-frame') &&
          frame.closest('dialog[data-td-compare][open]')) {
        window.OinkComparePane = true;
        document.documentElement.setAttribute('data-td-compare-pane', '');
      }
    } catch (_) {}
  })();
</script>
{{- end -}}
