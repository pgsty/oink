{{- /* Video and audio written as Markdown images. render-image.html hands a
       destination here when content/media-detect.html classifies it:

         ![name](demo.mp4)            a video file: native <video controls>
         ![name](episode.mp3)         an audio file: a titled native <audio>
         ![name](https://youtu.be/…)  a video-platform URL: a link card, and an
                                      in-place player for platforms listed in
                                      params.video_embeds

       The bracket text names the media (the accessible name; also the visible
       title of audio and platform cards). Block attributes: caption, num, id
       (video and platform cards), poster, track, autoplay, width, height (as
       they apply). Print and RSS receive static figures with the URL; the
       Markdown output keeps the authored line. Platform players load on click.
       Native media and any authored poster load from their supplied URLs.
       Input: page, format, position, src, alt, isBlock, attributes, ordinal,
       detect (from media-detect.html). Returns nothing; prints HTML. */ -}}
{{- $page := .page -}}
{{- $format := .format -}}
{{- $position := .position -}}
{{- $detect := .detect -}}
{{- $kind := $detect.kind -}}
{{- $label := cond (eq $kind "audio") "audio" "video" -}}
{{- $validated := partial "content/url.html" (dict
  "name" $label "label" $label "parameter" "src" "position" $position "value" .src "kind" "media"
) -}}
{{- if $validated.valid -}}
{{- $alt := strings.TrimSpace (.alt | default "") -}}
{{- $file := path.Base $validated.path -}}
{{- $href := $validated.href -}}
{{- if ne $kind "platform" -}}
  {{- with $detect.resource -}}
    {{- $href = .RelPermalink -}}
    {{- /* Both parts as written: RawQuery and EscapedFragment keep the
           author's percent-encoding, so href, src and the printed URL agree. */ -}}
    {{- with $detect.url.RawQuery }}{{ $href = printf "%s?%s" $href . }}{{ end -}}
    {{- with $detect.url.EscapedFragment }}{{ $href = printf "%s#%s" $href . }}{{ end -}}
  {{- end -}}
{{- end -}}
{{- $absolute := cond (or $validated.scheme (hasPrefix $href "#")) $href (absURL $href) -}}
{{- if eq $format "rss" }}{{ $href = $absolute }}{{ end -}}
{{- $fallbackName := cond (eq $kind "platform") $href ($file | default $href) -}}
{{- $name := $alt -}}
{{- if and (not .isBlock) (not $name) -}}
  {{- if eq $kind "audio" -}}
    {{- warnf "audio: the bracket text names the recording and is its visible title; it is empty at %s; using the file name" $position -}}
  {{- else -}}
    {{- warnf "%s: the bracket text names the video; it is empty at %s; using %s" $label $position (cond (eq $kind "platform") "the URL" "the file name") -}}
  {{- end -}}
{{- end -}}
{{- if not $name }}{{ $name = $fallbackName }}{{ end -}}

{{- if not .isBlock -}}
  {{- /* Inline media stays inline: a plain link to the file or watch page. */ -}}
<a class="td-media-link" href="{{ $href }}"{{ if $validated.scheme }} rel="external"{{ end }}>{{ $name }}</a>
{{- else -}}

{{- /* Block attributes. */ -}}
{{- $allowed := slice "id" "caption" "preload" -}}
{{- if eq $kind "video" }}{{ $allowed = slice "id" "num" "caption" "poster" "track" "autoplay" "width" "height" }}{{ end -}}
{{- if eq $kind "platform" }}{{ $allowed = slice "id" "num" "caption" "poster" "width" "height" }}{{ end -}}
{{- $policy := partial "content/attributes.html" (dict "attributes" .attributes "allowed" $allowed "position" $position "kind" $label) -}}
{{- $caption := strings.TrimSpace (index $policy.consumed "caption" | default "") -}}
{{- $block := hugo.Context.MarkupScope -}}
{{- if not (hasPrefix $block "td-block/") }}{{ $block = "" }}{{ end -}}
{{- $identity := printf "%s:%s:%d" $block $kind .ordinal -}}
{{- if and (not $alt) (eq $kind "audio") -}}
  {{- if $caption -}}
    {{- warnf "audio: the bracket text names the recording and is its visible title; it is empty at %s (move the title from caption into the brackets); using the file name" $position -}}
  {{- else -}}
    {{- warnf "audio: the bracket text names the recording and is its visible title; it is empty at %s; using the file name" $position -}}
  {{- end -}}
{{- end -}}
{{- $num := "" -}}
{{- $id := "" -}}
{{- with index $policy.consumed "num" -}}
  {{- $num = partial "book/validate-num.html" (dict "name" $label "value" . "position" $position) -}}
{{- end -}}
{{- with index $policy.consumed "id" -}}
  {{- $id = partial "book/validate-id.html" (dict "name" $label "label" $label "value" . "position" $position) -}}
{{- end -}}
{{- $mediaIDs := $page.Store.Get "tdMediaIDs" | default (dict) -}}
{{- if $num -}}
  {{- if not $id }}{{ $id = printf "fig-%s" $num }}{{ end -}}
  {{- if and (isset $mediaIDs $id) (ne (index $mediaIDs $id) $identity) -}}
    {{- warnf "%s: duplicate id %q at %s; keeping the first" $label $id $position -}}
    {{- $id = "" -}}
  {{- else if not (partial "book/register-target.html" (dict "page" $page "kind" "fig" "source" $label "num" $num "id" $id "caption" $caption "position" $position "ordinal" .ordinal)) -}}
    {{- $id = "" -}}
  {{- end -}}
{{- else if $id -}}
  {{- $bookTargets := $page.Store.Get "tdBookTargets" | default (dict) -}}
  {{- if isset $bookTargets $id -}}
    {{- warnf "%s: duplicate id %q at %s; keeping the first" $label $id $position -}}
    {{- $id = "" -}}
  {{- else if isset $mediaIDs $id -}}
    {{- if ne (index $mediaIDs $id) $identity -}}
      {{- warnf "%s: duplicate id %q at %s; keeping the first" $label $id $position -}}
      {{- $id = "" -}}
    {{- end -}}
  {{- else -}}
    {{- $page.Store.SetInMap "tdMediaIDs" $id $identity -}}
  {{- end -}}
{{- end -}}
{{- /* Every player needs a name: the bracket text, else the caption, else
       the file name (or watch URL for platforms), with a warning when the
       author gave neither. */ -}}
{{- if and (not $alt) (ne $kind "audio") -}}
  {{- if $caption -}}
    {{- $name = $caption -}}
  {{- else -}}
    {{- warnf "%s: the bracket text names the video for assistive technology; it and the caption are empty at %s; using %s" $label $position (cond (eq $kind "platform") "the URL" "the file name") -}}
  {{- end -}}
{{- end -}}
{{- $bookLabel := "" -}}
{{- if $num }}{{ $bookLabel = partial "book/label.html" (dict "kind" "fig" "num" $num) }}{{ end -}}
{{- $poster := false -}}
{{- with index $policy.consumed "poster" -}}
  {{- $resolved := partial "content/image-resolve.html" (dict
    "name" $label "label" (printf "%s poster" $label) "position" $position "page" $page "src" . "decorative" true
  ) -}}
  {{- if $resolved.src }}{{ $poster = $resolved }}{{ end -}}
{{- end -}}
{{- $posterWidth := 0 -}}
{{- $posterHeight := 0 -}}
{{- with $poster }}{{ $posterWidth = .width }}{{ $posterHeight = .height }}{{ end -}}
{{- $authorWidth := 0 -}}
{{- $authorHeight := 0 -}}
{{- range $key := slice "width" "height" -}}
  {{- with index $policy.consumed $key -}}
    {{- if findRE `^[1-9][0-9]{0,4}$` . -}}
      {{- if eq $key "width" }}{{ $authorWidth = int . }}{{ else }}{{ $authorHeight = int . }}{{ end -}}
    {{- else -}}
      {{- warnf "%s: %s must be a positive integer; got %q at %s; ignoring it" $label $key . $position -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if ne (gt $authorWidth 0) (gt $authorHeight 0) -}}
  {{- warnf "%s: width and height must be given together at %s; ignoring the single dimension" $label $position -}}
  {{- $authorWidth = 0 -}}
  {{- $authorHeight = 0 -}}
{{- end -}}
{{- $width := cond (and (gt $authorWidth 0) (gt $authorHeight 0)) $authorWidth $posterWidth -}}
{{- $height := cond (and (gt $authorWidth 0) (gt $authorHeight 0)) $authorHeight $posterHeight -}}
{{- /* "W / H": the <video> box takes it as aspect-ratio, a platform card as
       --td-media-ratio, from which media.css derives both its ratio and the
       width cap that keeps a portrait card within 80vh in every engine. */ -}}
{{- $ratio := "" -}}
{{- if and (gt $width 0) (gt $height 0) }}{{ $ratio = printf "%d / %d" $width $height }}{{ end -}}
{{- $posterSrc := "" -}}
{{- with $poster }}{{ $posterSrc = cond (eq $format "rss") (absURL .src) .src }}{{ end -}}

{{- $classes := slice "td-media" (printf "td-media--%s" (cond (eq $kind "platform") "embed" $kind)) -}}
{{- if and (ne $kind "audio") (or $caption $num) }}{{ $classes = $classes | append "td-figure" }}{{ end -}}
{{- if $num }}{{ $classes = $classes | append "td-book-figure" "td-book-figure--fig" }}{{ end -}}
{{- $classes = $classes | append $policy.classes -}}
{{- $figcaption := "" -}}
{{- if or $caption $bookLabel -}}
  {{- $figcaption = printf `<figcaption>%s%s</figcaption>`
    (cond (ne $bookLabel "") (printf `<span class="td-fig-label">%s</span>` (htmlEscape $bookLabel)) "")
    (cond (ne $caption "") (printf ` <span class="td-fig-caption">%s</span>` (htmlEscape $caption)) "") -}}
{{- end -}}
{{- $open := printf `<figure%s class="%s"%s%s>`
  (cond (ne $id "") (printf ` id="%s"` $id) "")
  (delimit $classes " ")
  (cond (ne $num "") (printf ` data-td-book-kind="fig" data-td-book-num="%s"` $num) "")
  (partial "content/attrs.html" $policy.generic) -}}
{{- $urlLine := printf `<p class="td-media__url"><a href="%s"%s>%s</a></p>` (htmlEscape $href) (cond (ne $validated.scheme "") ` rel="external"` "") (htmlEscape $absolute) -}}
{{- /* Paper and feeds have no player: name the video beside its address. */ -}}
{{- $staticLine := printf `<p class="td-media__link"><a href="%s"%s>%s</a> · <span class="td-media__address">%s</span></p>` (htmlEscape $href) (cond (ne $validated.scheme "") ` rel="external"` "") (htmlEscape $name) (htmlEscape $absolute) -}}

{{- if eq $kind "audio" -}}
  {{- /* Audio has no picture, so its name is a visible title. */ -}}
  {{- $preloadDefault := "metadata" -}}
  {{- if eq $format "html" -}}
    {{- $audioSeen := $page.Store.Get "tdAudioSeen" | default (dict) -}}
    {{- $audioIdx := index $audioSeen $identity | default 0 -}}
    {{- if eq $audioIdx 0 -}}
      {{- $audioIdx = add (len $audioSeen) 1 -}}
      {{- $page.Store.SetInMap "tdAudioSeen" $identity $audioIdx -}}
    {{- end -}}
    {{- if gt $audioIdx 6 }}{{ $preloadDefault = "none" }}{{ end -}}
    {{- $page.Store.SetInMap "tdMediaPlayers" $identity true -}}
    {{- if ge (len ($page.Store.Get "tdMediaPlayers")) 2 }}{{ $page.Store.Set "hasMedia" true }}{{ end -}}
  {{- end -}}
  {{- $preload := $preloadDefault -}}
  {{- with index $policy.consumed "preload" -}}
    {{- $value := lower (strings.TrimSpace .) -}}
    {{- if in (slice "metadata" "none") $value -}}
      {{- $preload = $value -}}
    {{- else if eq $format "html" -}}
      {{- /* preload exists only on the HTML player, whose default depends on
             the player count; other outputs drop it without a second, differing
             warning. */ -}}
      {{- warnf "audio: preload must be metadata or none; got %q at %s; using %s" . $position $preloadDefault -}}
    {{- end -}}
  {{- end -}}
  {{- if eq $format "rss" -}}
    {{- $rssTitle := printf `<figcaption><span class="td-media__title"><a href="%s"%s>%s</a></span>%s</figcaption>`
      (htmlEscape $href)
      (cond (ne $validated.scheme "") ` rel="external"` "")
      (htmlEscape $name)
      (cond (ne $caption "") (printf ` <span class="td-fig-caption">%s</span>` (htmlEscape $caption)) "") -}}
{{ $open | safeHTML }}{{ $rssTitle | safeHTML }}</figure>
  {{- else if eq $format "print" -}}
    {{- $printTitle := printf `<figcaption><span class="td-media__title">%s</span>%s</figcaption>`
      (htmlEscape $name)
      (cond (ne $caption "") (printf ` <span class="td-fig-caption">%s</span>` (htmlEscape $caption)) "") -}}
    {{- $printLink := printf `<p class="td-media__link"><a href="%s"%s>%s</a></p>`
      (htmlEscape $href)
      (cond (ne $validated.scheme "") ` rel="external"` "")
      (htmlEscape $absolute) -}}
{{ $open | safeHTML }}{{ $printTitle | safeHTML }}{{ $printLink | safeHTML }}</figure>
  {{- else -}}
    {{- $audioBase := printf "td-audio-%s-a%d" (md5 $page.RelPermalink) .ordinal -}}
    {{- $titleID := printf "%s-title" $audioBase -}}
    {{- $captionID := cond (ne $caption "") (printf "%s-caption" $audioBase) "" -}}
    {{- $title := printf `<figcaption><span class="td-media__title" id="%s">%s</span>%s</figcaption>`
      $titleID
      (htmlEscape $name)
      (cond (ne $caption "") (printf ` <span class="td-fig-caption" id="%s">%s</span>` $captionID (htmlEscape $caption)) "") -}}
{{ $open | safeHTML }}{{ $title | safeHTML }}<audio controls preload="{{ $preload }}" src="{{ $href }}" aria-labelledby="{{ $titleID }}"{{ with $captionID }} aria-describedby="{{ . }}"{{ end }}><a href="{{ $href }}">{{ $name }}</a></audio>{{ $urlLine | safeHTML }}</figure>
  {{- end -}}

{{- else if eq $kind "video" -}}
  {{- $track := "" -}}
  {{- $trackRemote := false -}}
  {{- with index $policy.consumed "track" -}}
    {{- $trackURL := partial "content/url.html" (dict "name" "video" "label" "video" "parameter" "track" "position" $position "value" . "kind" "media") -}}
    {{- if $trackURL.valid -}}
      {{- $found := partial "content/resource-lookup.html" (dict "page" $page "source" $trackURL.path "scheme" $trackURL.scheme) -}}
      {{- $track = $trackURL.href -}}
      {{- $trackRemote = ne $trackURL.scheme "" -}}
      {{- with $found.resource -}}
        {{- $track = .RelPermalink -}}
        {{- $trackRemote = false -}}
        {{- $parsedTrack := try (urls.Parse $trackURL.raw) -}}
        {{- if not $parsedTrack.Err -}}
          {{- with $parsedTrack.Value.RawQuery }}{{ $track = printf "%s?%s" $track . }}{{ end -}}
          {{- with $parsedTrack.Value.EscapedFragment }}{{ $track = printf "%s#%s" $track . }}{{ end -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- $autoplay := false -}}
  {{- with index $policy.consumed "autoplay" -}}
    {{- $value := lower (strings.TrimSpace .) -}}
    {{- if eq $value "true" }}{{ $autoplay = true }}{{ else if ne $value "false" }}{{ warnf "video: autoplay must be true or false; got %q at %s; using false" . $position }}{{ end -}}
  {{- end -}}
  {{- if in (slice "print" "rss") $format -}}
{{ $open | safeHTML }}{{ with $posterSrc }}<img class="td-media__poster" src="{{ . }}" alt="{{ $name }}"{{ if gt $posterWidth 0 }} width="{{ $posterWidth }}"{{ end }}{{ if gt $posterHeight 0 }} height="{{ $posterHeight }}"{{ end }} loading="lazy" decoding="async">{{ end }}{{ $staticLine | safeHTML }}{{ $figcaption | safeHTML }}</figure>
  {{- else -}}
    {{- $page.Store.SetInMap "tdMediaPlayers" $identity true -}}
    {{- if or $autoplay (ge (len ($page.Store.Get "tdMediaPlayers")) 2) }}{{ $page.Store.Set "hasMedia" true }}{{ end -}}
{{ $open | safeHTML }}<video controls preload="metadata" playsinline src="{{ $href }}"{{ if $trackRemote }} crossorigin="anonymous"{{ end }}{{ with $posterSrc }} poster="{{ . }}"{{ end }}{{ if gt $width 0 }} width="{{ $width }}"{{ end }}{{ if gt $height 0 }} height="{{ $height }}"{{ end }}{{ with $ratio }} style="{{ printf "aspect-ratio: %s" . | safeCSS }}"{{ end }}{{ if $autoplay }} muted loop data-td-media-autoplay{{ end }} aria-label="{{ $name }}">
  {{- with $track }}<track kind="subtitles" src="{{ . }}" srclang="{{ $page.Language.Lang }}" label="{{ $page.Language.Label | default $page.Language.Lang }}" default>{{ end -}}
  <a href="{{ $href }}">{{ $name }}</a></video>{{ $urlLine | safeHTML }}{{ $figcaption | safeHTML }}</figure>
  {{- end -}}

{{- else -}}
  {{- /* A video-platform URL. The theme derives the player URL from IDs it
         validated itself; author text never reaches an iframe address. */ -}}
  {{- $url := $detect.url -}}
  {{- $platform := $detect.platform -}}
  {{- $host := lower $url.Hostname | strings.TrimPrefix "www." | strings.TrimPrefix "m." -}}
  {{- $path := strings.TrimSuffix "/" $url.Path -}}
  {{- $player := "" -}}
  {{- $platformName := index (dict "youtube" "YouTube" "bilibili" "Bilibili" "vimeo" "Vimeo") $platform -}}
  {{- $icon := index (dict "youtube" "fa-brands fa-youtube" "bilibili" "fa-brands fa-bilibili" "vimeo" "fa-brands fa-vimeo-v") $platform -}}
  {{- $seconds := 0 -}}
  {{- $time := $url.Query.Get "t" | default ($url.Query.Get "start") -}}
  {{- if and (not $time) $url.Fragment -}}
    {{- with findRESubmatch `(?i)^t=(.+)$` $url.Fragment 1 }}{{ $time = index (index . 0) 1 }}{{ end -}}
  {{- end -}}
  {{- $time = lower (strings.TrimSpace $time) -}}
  {{- if $time -}}
    {{- with findRESubmatch `^(?:([0-9]{1,2})h)?(?:([0-9]{1,4})m)?(?:([0-9]{1,6})(?:\.[0-9]+)?s?)?$` $time 1 -}}
      {{- $m := index . 0 -}}
      {{- if or (index $m 1) (index $m 2) (index $m 3) -}}
        {{- /* Parse via float so leading zeros (08, 010) stay decimal instead of octal. */ -}}
        {{- $seconds = add
          (mul (int (float (index $m 1 | default "0"))) 3600)
          (mul (int (float (index $m 2 | default "0"))) 60)
          (int (float (index $m 3 | default "0"))) -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- if eq $platform "youtube" -}}
    {{- $video := "" -}}
    {{- $isShort := false -}}
    {{- if eq $host "youtu.be" -}}
      {{- $video = strings.TrimPrefix "/" $path -}}
    {{- else if eq $path "/watch" -}}
      {{- $video = $url.Query.Get "v" -}}
    {{- else -}}
      {{- with findRESubmatch `^/(shorts|live|embed)/([^/]+)$` $path 1 -}}
        {{- $m := index . 0 -}}
        {{- $video = index $m 2 -}}
        {{- if eq (index $m 1) "shorts" }}{{ $isShort = true }}{{ end -}}
      {{- end -}}
    {{- end -}}
    {{- if findRE `^[A-Za-z0-9_-]{11}$` $video -}}
      {{- $player = printf "https://www.youtube-nocookie.com/embed/%s?autoplay=1" $video -}}
      {{- if gt $seconds 0 }}{{ $player = printf "%s&start=%d" $player $seconds }}{{ end -}}
      {{- if and $isShort (not $ratio) }}{{ $ratio = "9 / 16" }}{{ end -}}
    {{- end -}}
  {{- else if eq $platform "bilibili" -}}
    {{- $query := "" -}}
    {{- if eq $host "b23.tv" -}}
      {{- with findRESubmatch `^/(BV[0-9A-Za-z]{10})$` $path 1 }}{{ $query = printf "bvid=%s" (index (index . 0) 1) }}{{ end -}}
      {{- with findRESubmatch `(?i)^/av([0-9]{1,12})$` $path 1 }}{{ $query = printf "aid=%s" (index (index . 0) 1) }}{{ end -}}
    {{- else if eq $host "player.bilibili.com" -}}
      {{- /* Bilibili's own embed code: the IDs sit in the query, often both;
             the BV ID wins. An explicit content ID selects a part below. */ -}}
      {{- if eq $path "/player.html" -}}
        {{- $bvid := $url.Query.Get "bvid" -}}
        {{- $aid := $url.Query.Get "aid" -}}
        {{- if findRE `^BV[0-9A-Za-z]{10}$` $bvid }}{{ $query = printf "bvid=%s" $bvid }}{{ else if findRE `^[0-9]{1,12}$` $aid }}{{ $query = printf "aid=%s" $aid }}{{ end -}}
      {{- end -}}
    {{- else -}}
      {{- with findRESubmatch `^/video/(BV[0-9A-Za-z]{10})$` $path 1 }}{{ $query = printf "bvid=%s" (index (index . 0) 1) }}{{ end -}}
      {{- with findRESubmatch `(?i)^/video/av([0-9]{1,12})$` $path 1 }}{{ $query = printf "aid=%s" (index (index . 0) 1) }}{{ end -}}
    {{- end -}}
    {{- if $query -}}
      {{- $part := $url.Query.Get "p" -}}
      {{- if not (findRE `^[1-9][0-9]{0,3}$` $part) }}{{ $part = "1" }}{{ end -}}
      {{- $partQuery := printf "p=%s" $part -}}
      {{- if eq $host "player.bilibili.com" -}}
        {{- with $url.Query.Get "cid" }}{{ if findRE `^[1-9][0-9]{0,18}$` . }}{{ $partQuery = printf "cid=%s" . }}{{ end }}{{ end -}}
      {{- end -}}
      {{- $player = printf "https://player.bilibili.com/player.html?%s&%s&autoplay=1&danmaku=0" $query $partQuery -}}
      {{- if gt $seconds 0 }}{{ $player = printf "%s&t=%d" $player $seconds }}{{ end -}}
    {{- end -}}
  {{- else if eq $platform "vimeo" -}}
    {{- $video := "" -}}
    {{- $hash := "" -}}
    {{- if eq $host "player.vimeo.com" -}}
      {{- with findRESubmatch `^/video/([0-9]{1,12})$` $path 1 }}{{ $video = index (index . 0) 1 }}{{ end -}}
    {{- else -}}
      {{- with findRESubmatch `^/(?:manage/videos/)?([0-9]{1,12})(?:/([0-9A-Fa-f]{6,20}))?$` $path 1 -}}
        {{- $m := index . 0 -}}
        {{- $video = index $m 1 -}}
        {{- $hash = index $m 2 -}}
      {{- end -}}
    {{- end -}}
    {{- if not $hash }}{{ $hash = $url.Query.Get "h" }}{{ end -}}
    {{- if not (findRE `^[0-9A-Fa-f]{6,20}$` $hash) }}{{ $hash = "" }}{{ else }}{{ $hash = lower $hash }}{{ end -}}
    {{- if $video -}}
      {{- $player = printf "https://player.vimeo.com/video/%s?autoplay=1&dnt=1" $video -}}
      {{- with $hash }}{{ $player = printf "%s&h=%s" $player . }}{{ end -}}
      {{- if gt $seconds 0 }}{{ $player = printf "%s#t=%ds" $player $seconds }}{{ end -}}
    {{- end -}}
  {{- end -}}
  {{- if not $player -}}
    {{- if eq $host "b23.tv" -}}
      {{- warnf "video: %s short links cannot be resolved without the network at %s; link the full bilibili.com/video/BV… URL to allow the player; rendering a link card" $validated.raw $position -}}
    {{- else -}}
      {{- warnf "video: no %s video ID in %q at %s; rendering a link card without a player" $platformName $validated.raw $position -}}
    {{- end -}}
  {{- end -}}
  {{- $embed := and $player (eq $format "html") (in (partialCached "content/video-embeds.html" . $page.Site.Language.Lang) $platform) -}}
  {{- $cardUrlLine := printf `<p class="td-media__url"><span class="td-media__url-title">%s · %s · </span><a href="%s" rel="external">%s</a></p>` (htmlEscape $name) (htmlEscape $platformName) (htmlEscape $href) (htmlEscape $absolute) -}}
  {{- if in (slice "print" "rss") $format -}}
{{ $open | safeHTML }}{{ with $posterSrc }}<img class="td-media__poster" src="{{ . }}" alt="{{ $name }}"{{ if gt $posterWidth 0 }} width="{{ $posterWidth }}"{{ end }}{{ if gt $posterHeight 0 }} height="{{ $posterHeight }}"{{ end }} loading="lazy" decoding="async">{{ end }}<p class="td-media__link"><a href="{{ $href }}" rel="external">{{ $name }}</a> · {{ $platformName }} · <span class="td-media__address">{{ $absolute }}</span></p>{{ $figcaption | safeHTML }}</figure>
  {{- else -}}
    {{- if $embed }}{{ $page.Store.Set "hasMedia" true }}{{ end -}}
{{ $open | safeHTML }}<a class="td-media-card" href="{{ $href }}" rel="external"{{ with $ratio }} style="{{ printf "--td-media-ratio: %s" . | safeCSS }}"{{ end }}{{ if $embed }} data-td-media-embed="{{ $player }}" data-td-media-title="{{ $name }}"{{ end }}>
  {{- with $posterSrc }}<img class="td-media-card__poster" src="{{ . }}" alt=""{{ if gt $posterWidth 0 }} width="{{ $posterWidth }}"{{ end }}{{ if gt $posterHeight 0 }} height="{{ $posterHeight }}"{{ end }} loading="lazy" decoding="async">{{ end -}}
  <span class="td-media-card__play" aria-hidden="true"><i class="fa-solid fa-play"></i></span>
  <span class="td-media-card__text"><span class="td-media-card__title">{{ $name }}</span><span class="visually-hidden"> · </span><span class="td-media-card__platform"><i class="{{ $icon }}" aria-hidden="true"></i> {{ $platformName }}</span><span class="visually-hidden"> · {{ if $embed }}{{ T "ui_video_play" }}{{ else }}{{ T "ui_video_open" }}{{ end }}</span></span>
</a>{{ $cardUrlLine | safeHTML }}{{ $figcaption | safeHTML }}</figure>
  {{- end -}}
{{- end -}}
{{- end -}}
