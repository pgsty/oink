{{- .Page.Store.Set "tdOutputFormat" "print" -}}
<!doctype html>
<html itemscope itemtype="http://schema.org/WebPage"
    dir="{{ .Site.Language.Direction | default "ltr" }}"
    lang="{{ partial "language-tag.html" . }}"
    data-td-typography="{{ partial "typography-preset.html" .Site }}">
  <head>{{ partial "head.html" . }}</head>
  <body class="td-{{ .Kind }} td-book td-print-view{{ with .Page.Params.body_class }} {{ . }}{{ end }}">
    {{ partial "skip-link.html" . }}
    <div class="container-fluid td-print-shell">
      <main id="td-main-content" class="td-print-document" role="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
    </div>
    {{ partial "scripts.html" . }}
  </body>
</html>
