{{ define "main" -}}
<div class="td-content">
  {{- partial "print/page-heading.html" . -}}
  {{- with .Description }}<div class="lead">{{ . | markdownify }}</div>{{ end -}}
  {{ $content := partialCached "print/page-content.html" (dict "page" .) .RelPermalink -}}
  {{ $content.plain }}
</div>
{{- end }}
