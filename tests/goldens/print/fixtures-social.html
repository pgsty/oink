<script>
(function() {
const themeKey = 'td-color-theme';
let storedTheme = null;
try {
storedTheme = localStorage.getItem(themeKey);
if (storedTheme !== null && !['light', 'dark', 'auto'].includes(storedTheme)) {
storedTheme = null;
localStorage.removeItem(themeKey);
}
} catch (_) {
}
let theme = storedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
if (theme === 'auto') {
theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
document.documentElement.setAttribute('data-bs-theme', theme);
document.querySelectorAll('meta[name="theme-color"]').forEach(function(meta) {
meta.setAttribute('content', meta.getAttribute('data-td-canvas-' + theme));
});
document.documentElement.classList.toggle('dark-mode', theme === 'dark');
document.documentElement.setAttribute('data-theme', theme);
})();
</script>
