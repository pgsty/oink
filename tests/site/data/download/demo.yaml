version: 2.4.1
repo: pgsty/oink
published: true
channels:
  - id: script
    kind: rolling
    title: Install script
    title_zh: 一键安装脚本
    icon: fa-solid fa-bolt
    note: Mirrors track the rolling stable channel and may lag the GitHub release.
    note_zh: 镜像跟随滚动稳定渠道，可能滞后于 GitHub Release。
    steps:
      - title: Install
        title_zh: 安装
        code: curl -fsSL https://repo.example.org/demo | bash
        lang: bash
  - id: source
    kind: pinned
    title: Source archive
    title_zh: 源码归档
    icon: fa-solid fa-code-branch
    url: https://github.com/pgsty/oink/archive/refs/tags/${tag}.tar.gz
    steps:
      - title: Build source
        title_zh: 构建源码
        code: git clone --branch ${tag} https://github.com/pgsty/oink.git
        lang: bash
  - id: assets
    kind: pinned
    title: Release assets
    title_zh: 发布资产
    icon: fa-solid fa-box-open
    checksums_src: release/demo-download-checksums.txt
