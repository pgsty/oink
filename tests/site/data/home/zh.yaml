# 这个文件就是这一页。`sections` 是出场顺序，它下面的每个键就是一块内容。
# 删掉一个条目，那一块就消失；挪动一个条目，那一块就跟着挪。映射形式的条目
# 可以用 `key` 指向另一个数据块——下面三面 Logo 墙就是这样共用同一种区块的。
sections:
  - hero
  - metrics
  - capabilities
  - cards
  - type: logo-wall
    key: components
  - type: logo_wall
    key: ecosystem
  - gallery
  - testimonials
  - contributors
  - faq
  - markdown
  - principles
  - type: logo-wall
    key: showcase
  - cta

hero:
  eyebrow: 只用 Hugo · 本地优先 · 零 npm
  # 两行大标题；每一行自成一块，不折行。
  title_lines:
    - 输入纯 Markdown。
    - 输出现代文档。
  desc: 搜索、多语言、版本、图表、公式——全都在主题里。整个构建步骤只有一条命令：`hugo`。
  note: 不需要 npm、CDN 或任何 JavaScript 框架。
  actions:
    - label: 浏览组件
      url: docs/
      icon: fa-solid fa-book-open
      style: primary
    - label: 读一读这页的 YAML
      url: https://github.com/pgsty/oink/blob/main/tests/site/data/home/zh.yaml
      icon: fa-solid fa-file-code
      style: ghost
      external: true

metrics:
  eyebrow: 自己数一遍
  title: 这一页的全部成本
  desc: 四个数字，每个都能在仓库里对上。
  columns: 4
  items:
    - value: 1
      label: 数据文件
      desc: '`data/home/zh.yaml`'
      icon: fa-solid fa-file-code
    - value: 14
      label: 本页区块
      desc: 从 22 种区块类型里挑出来的
      icon: fa-solid fa-layer-group
    - value: 0
      label: 改过的模板
      desc: 顺序是数据，不是标记
      icon: fa-solid fa-code
    - value: 0
      label: 运行时依赖
      desc: 不装 npm，不连 CDN，不跑 PostCSS
      icon: fa-solid fa-plug

capabilities:
  eyebrow: 它是怎么拼出来的
  title: 区块列表就是版式
  desc: 一个分发器读这个数组，每个条目走自己的 partial。
  items:
    - ref: 01 / 区块列表
      title: 挪动一行，就挪动一整块
      url: https://gohugo.io/templates/partial/
      external: true
      motto: 一个分发器，一种区块一个 partial
      bullets:
        - 把区块名字写进 `sections` 数组，它就会渲染。
        - 两个条目指向不同的 `key`，同一种类型就能复用。
        - '临时下线写 `enabled: false`，数据不必删。'
      value: 页面结构现在是数据。重排它是改文本，不是改模板。
      visual:
        type: code
        title: data/home/zh.yaml
        aria_label: 落地页区块配置
        lines:
          - { class: c, prefix: '# ', text: 这一页，按顺序 }
          - { class: p, prefix: '- ', text: hero }
          - { class: ok, prefix: '- ', text: metrics }
          - { class: ok, prefix: '- ', text: capabilities }

cards:
  eyebrow: 卡片
  title: 三个映射条目，三张卡片
  desc: 通用的集合区块——特性、优势、服务，任何一组短内容都可以放进来。
  columns: 3
  link_label: 了解更多
  items:
