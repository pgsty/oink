faq:
  eyebrow: 常见问题
  title: 关于这一页，大家都会问
  desc: 答案是块级 Markdown，列表与多个段落都能照常使用。
  items:
    - question: 真的只有一个文件？
      answer: 导航栏与页脚之间的部分是。导航来自 `hugo.yaml`，页脚来自 `data/footer/zh.yaml`，中间每一块都来自 `data/home/zh.yaml`。
      open: true
    - question: 每种语言都得有一个文件吗？
      answer: 单语言站点用一个 `data/home.yaml` 就够。本站是双语，所以用 `data/home/en.yaml` 与 `data/home/zh.yaml`。
    - question: 同一种区块可以出现多次吗？
      answer: |
        可以，给每个条目不同的 `key`：

        - `{ type: gallery, key: products }`
        - `{ type: gallery, key: case_studies }`

        本页那三面 Logo 墙，就是同一种区块读三份不同的数据。
    - question: 没写 `url` 会怎样？
      answer: 这一项按普通内容渲染——不留空链接，也不留坏链接。上面三张卡片里，有两张就没写 `url`。

markdown:
  eyebrow: 自由 Markdown
  title: 逃生口
  desc: 预定义的集合表达不了时，把 Markdown 直接写进数据文件。
  body: |
    这一段是同一个 YAML 文件里的一个 `body:` 字符串。它支持段落、[链接](https://gohugo.io/)与列表：

    - 不需要自定义模板；
    - 就是普通的 Goldmark 渲染；
    - 与上面每一块同样的宽度与竖向节奏。

principles:
