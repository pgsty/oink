# Behaviour fixtures live outside exampleSite so the published example stays
# small. Check scripts merge this file with exampleSite/hugo.yaml to mount the
# fixtures only for regression builds.
module:
  mounts:
    - source: content
      target: content
    - source: ../tests/site/content
      target: content
    - source: assets
      target: assets
    - source: ../tests/site/assets
      target: assets
    - source: layouts
      target: layouts
    - source: ../tests/site/layouts
      target: layouts
    - source: static
      target: static
    - source: ../tests/site/static
      target: static

# Taxonomy fixtures. exampleSite disables the taxonomy and term kinds so the
# published example stays a component reference; the regression build needs
# both, and the later file in the merge list replaces a scalar list outright.
disableKinds: [sitemap]
taxonomies:
  author: authors
  series: series
