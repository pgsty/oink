# Behaviour fixtures live outside exampleSite so the published example stays
# small. Check scripts merge this file with exampleSite/hugo.yaml to mount the
# fixtures only for regression builds.
module:
  mounts:
    - source: content
      target: content
    - source: ../tests/site/content
      target: content
    - source: assets
      target: assets
    - source: ../tests/site/assets
      target: assets
    - source: layouts
      target: layouts
    - source: ../tests/site/layouts
      target: layouts
    - source: static
      target: static
    - source: ../tests/site/static
      target: static

# Regression builds exercise taxonomy surfaces the published example does not
# carry. Both keys override exampleSite/hugo.yaml wholesale: Hugo merges a
# `--config a,b` list with the later file winning per key, so `disableKinds`
# narrows here and the taxonomy map replaces Hugo's `tags`/`categories`
# default (no fixture page uses either).
disableKinds: [sitemap]
taxonomies:
  author: authors
  series: series
